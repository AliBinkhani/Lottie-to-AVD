<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lottie to AnimatedVectorDrawable – free online converter for Android</title>
<meta name="description" content="Free online converter from Lottie JSON animations to Android AnimatedVectorDrawable (AVD) XML. Supports shapes, gradients, track mattes, masks and trim paths, with a live side-by-side preview. Runs entirely in your browser.">
<meta name="keywords" content="Lottie, AnimatedVectorDrawable, AVD, Android, vector drawable, animation, converter, After Effects, Bodymovin">
<meta name="theme-color" content="#1B7F5A">
<link rel="canonical" href="https://alibinkhani.github.io/Lottie-to-AVD/">
<link rel="alternate" hreflang="en" href="https://alibinkhani.github.io/Lottie-to-AVD/">
<link rel="alternate" hreflang="fa" href="https://alibinkhani.github.io/Lottie-to-AVD/?lang=fa">
<link rel="alternate" hreflang="x-default" href="https://alibinkhani.github.io/Lottie-to-AVD/">
<link rel="icon" href="assets/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lottie → AVD">
<meta property="og:title" content="Lottie to AnimatedVectorDrawable converter">
<meta property="og:description" content="Convert Lottie JSON animations to Android AnimatedVectorDrawable XML, right in the browser, with a live side-by-side preview.">
<meta property="og:url" content="https://alibinkhani.github.io/Lottie-to-AVD/">
<meta property="og:image" content="https://alibinkhani.github.io/Lottie-to-AVD/assets/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Lottie to AnimatedVectorDrawable converter">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="fa_IR">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Lottie to AnimatedVectorDrawable",
  "alternateName": "Lottie to AVD",
  "url": "https://alibinkhani.github.io/Lottie-to-AVD/",
  "description": "Free online converter from Lottie JSON animations to Android AnimatedVectorDrawable XML, with a live preview. Runs entirely in the browser.",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Any (web browser)",
  "browserRequirements": "Requires JavaScript",
  "inLanguage": ["en", "fa"],
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "image": "https://alibinkhani.github.io/Lottie-to-AVD/assets/icons/icon-512.png",
  "codeRepository": "https://github.com/AliBinkhani/Lottie-to-AVD"
}
</script>
<link rel="stylesheet" href="src/css/fonts.css">
<link rel="stylesheet" href="src/css/styles.css">
<script src="vendor/lottie-web/lottie_light.min.js" defer></script>
<script type="module" src="src/js/ui/app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-bar">
      <div class="titles">
        <h1><img class="logo" src="assets/icons/favicon.svg" alt="" width="40" height="40"><bdi dir="ltr">Lottie <span class="arrow">→</span> AnimatedVectorDrawable</bdi></h1>
        <p data-i18n-html="header.subtitle"></p>
      </div>
      <button type="button" id="langBtn" class="lang-switch" data-i18n="meta.switchTo" data-i18n-attr="aria-label:meta.switchLabel"></button>
    </div>
  </header>

  <section class="panel" aria-labelledby="h-in">
    <h2 id="h-in" data-i18n="input.heading"></h2>
    <div class="drop" id="drop">
      <p data-i18n-html="input.drop"></p>
      <div class="drop-actions">
        <label class="btn label-btn">
          <span data-i18n="input.choose"></span>
          <input type="file" id="file" accept=".json,application/json" class="hidden">
        </label>
        <div class="sample-row">
          <select id="sampleSel" data-i18n-attr="aria-label:input.sampleLabel">
            <option value="sample.json" data-i18n="input.sampleBasic"></option>
            <option value="gradient.json" data-i18n="input.sampleGradient"></option>
            <option value="mattes.json" data-i18n="input.sampleMattes"></option>
          </select>
          <button id="sample" type="button" data-i18n="input.sample"></button>
        </div>
      </div>
    </div>
    <details class="opts">
      <summary data-i18n="input.options"></summary>
      <div class="grid-opts">
        <label><span data-i18n="input.resName"></span>
          <input type="text" id="resName" dir="ltr" value="avd_animation" spellcheck="false">
        </label>
        <label><span data-i18n="input.width"></span>
          <input type="number" id="dp" dir="ltr" value="120" min="1" max="2000">
        </label>
        <label><span data-i18n="input.precision"></span>
          <select id="prec">
            <option value="1"></option><option value="2"></option><option value="3" selected></option><option value="4"></option>
          </select>
        </label>
        <label><span data-i18n="input.step"></span>
          <select id="step">
            <option value="1" selected></option><option value="2"></option><option value="3"></option><option value="5"></option>
          </select>
        </label>
      </div>
      <label class="check opt-check">
        <input type="checkbox" id="gradients" checked>
        <span data-i18n="input.gradients"></span>
      </label>
      <p class="note" data-i18n="input.gradientsNote"></p>
      <p class="note" data-i18n="input.stepNote"></p>
    </details>
    <div class="meta" id="meta"></div>
    <div class="msg err hidden" id="err" role="alert"></div>
  </section>

  <section class="panel" aria-labelledby="h-pv">
    <div class="row" style="justify-content:space-between">
      <h2 id="h-pv" style="margin:0" data-i18n="preview.heading"></h2>
      <div class="mode" role="group" data-i18n-attr="aria-label:preview.modeLabel">
        <button type="button" id="mSide" aria-pressed="true" data-i18n="preview.side"></button>
        <button type="button" id="mOver" aria-pressed="false" data-i18n="preview.overlay"></button>
      </div>
    </div>
    <div class="stages" id="stages">
      <div class="stagecol">
        <div class="cap"><span class="dot l"></span><span id="capL"></span></div>
        <div class="stage lottie-stage" id="stageL">
          <div class="canvas" id="lottieBox"></div>
          <div class="canvas overlaybox" id="overlayBox"></div>
          <div class="empty" id="emptyL" data-i18n="preview.emptyL"></div>
        </div>
      </div>
      <div class="stagecol avdcol">
        <div class="cap"><span class="dot a"></span><span data-i18n="preview.avd"></span></div>
        <div class="stage" id="stageA">
          <div class="canvas" id="avdBox"></div>
          <div class="empty" id="emptyA" data-i18n="preview.emptyA"></div>
        </div>
      </div>
    </div>
    <p class="overlay-note hidden" id="overNote" data-i18n="preview.overlayNote"></p>
    <div class="controls">
      <button type="button" id="play" class="primary"></button>
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" data-i18n-attr="aria-label:preview.timeline">
      <span class="frame" id="frameLbl">–</span>
      <select id="speed" data-i18n-attr="aria-label:preview.speed">
        <option value="0.1"></option><option value="0.25"></option><option value="0.5"></option>
        <option value="1" selected></option><option value="2"></option>
      </select>
      <label class="check"><input type="checkbox" id="loop" checked> <span data-i18n="preview.loop"></span></label>
    </div>
    <p class="note" data-i18n="preview.note"></p>
  </section>

  <section class="panel hidden" id="warnPanel" aria-labelledby="h-w">
    <h2 id="h-w" data-i18n="report.heading"></h2>
    <ul class="warns" id="warns"></ul>
  </section>

  <section class="panel" aria-labelledby="h-out">
    <div class="row" style="justify-content:space-between">
      <h2 id="h-out" style="margin:0" data-i18n="output.heading"></h2>
      <div class="row">
        <button type="button" id="copy" disabled data-i18n="output.copy"></button>
        <button type="button" id="dl" disabled data-i18n="output.download"></button>
      </div>
    </div>
    <p class="note" style="margin-top:4px" data-i18n="output.editNote"></p>
    <textarea class="code" id="xml" dir="ltr" spellcheck="false" data-i18n-attr="aria-label:output.xmlLabel" placeholder="&lt;animated-vector …"></textarea>
    <div class="row" style="margin-top:8px">
      <button type="button" id="apply" disabled data-i18n="output.apply"></button>
    </div>
    <details class="howto" style="margin-top:14px">
      <summary data-i18n="output.howto"></summary>
      <ol>
        <li id="howtoStep1"></li>
        <li data-i18n-html="output.step2"></li>
        <li data-i18n-html="output.step3"></li>
      </ol>
      <pre class="code" dir="ltr" id="kotlin"></pre>
    </details>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
